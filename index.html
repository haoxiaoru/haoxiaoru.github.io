<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>郝晓茹的快乐源泉，持续更新中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            cursor: none;
        }

        .canvas {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(120, 80, 200, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 80%, rgba(255, 100, 120, 0.1) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(30, 30, 35, 1) 0%, rgba(10, 10, 10, 1) 100%);
        }

        .noise {
            position: fixed;
            inset: 0;
            opacity: 0.035;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .title {
            position: fixed;
            left: 50%;
            bottom: 6vh;
            transform: translateX(-50%);
            z-index: 1;
            text-align: center;
            pointer-events: none;
            user-select: none;
            width: 92vw;
        }

        .title h1 {
            font-size: clamp(0.75rem, 2vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.18);
            white-space: nowrap;
        }

        .logo {
            position: absolute;
            width: 120px;
            height: 120px;
            transform: translate(-50%, -50%) rotate(var(--rotate));
            will-change: transform;
            z-index: 5;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            transition: width 0.2s, height 0.2s, border-color 0.2s;
            mix-blend-mode: difference;
        }

        .cursor-dot {
            position: fixed;
            width: 5px;
            height: 5px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            mix-blend-mode: difference;
        }

        @media (pointer: coarse) {
            body { cursor: auto; }
            .cursor, .cursor-dot { display: none; }
        }
    </style>
</head>
<body>
    <div class="canvas"></div>
    <div class="noise"></div>
    <div class="title">
        <h1>郝晓茹的快乐源泉，持续更新中</h1>
    </div>
    <div class="cursor"></div>
    <div class="cursor-dot"></div>

    <script>
        const images = [
            'images/logos/01_SNL.jpg',
            'images/logos/02_Friends_logo.png',
            'images/logos/03_TBBT_logo.png',
            'images/logos/04_喜人奇妙夜_logo.png',
            'images/logos/05_一年一度喜剧大赛_logo.png',
            'images/logos/06_脱口秀和Ta的朋友们_logo.jpg',
            'images/logos/07_喜剧之王单口季_logo.png',
            'images/logos/08_Conan_OBrien_Needs_a_Friend_podcast.jpg',
            'images/logos/09_基本无害_podcast.jpg',
            'images/logos/10_不开玩笑_podcast.jpg',
            'images/logos/11_谐星聊天会_podcast.jpg'
        ];

        const canvas = document.querySelector('.canvas');
        const cursor = document.querySelector('.cursor');
        const cursorDot = document.querySelector('.cursor-dot');

        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        let cursorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        const logos = [];
        const logoSize = 120;
        const repelRadius = 170;
        const repelStrength = 0.9;
        const returnStrength = 0.05;
        const friction = 0.86;
        const floatSpeed = 0.00035;
        const floatAmp = 8;

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createLogos() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            images.forEach((src, i) => {
                const el = document.createElement('div');
                el.className = 'logo';

                const angle = random(-16, 16);
                const x = random(logoSize, w - logoSize);
                const y = random(logoSize, h - logoSize);

                el.style.setProperty('--rotate', `${angle}deg`);
                el.style.left = '0px';
                el.style.top = '0px';

                const img = document.createElement('img');
                img.src = src;
                img.alt = '';
                el.appendChild(img);
                canvas.appendChild(el);

                logos.push({
                    el,
                    originX: x,
                    originY: y,
                    x: x,
                    y: y,
                    vx: 0,
                    vy: 0,
                    angle,
                    phase: random(0, Math.PI * 2),
                    phase2: random(0, Math.PI * 2)
                });
            });
        }

        function updateMouse(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }

        function animate() {
            cursorPos.x += (mouse.x - cursorPos.x) * 0.15;
            cursorPos.y += (mouse.y - cursorPos.y) * 0.15;
            cursor.style.left = `${cursorPos.x}px`;
            cursor.style.top = `${cursorPos.y}px`;
            cursorDot.style.left = `${mouse.x}px`;
            cursorDot.style.top = `${mouse.y}px`;

            const time = Date.now();

            logos.forEach(logo => {
                const floatX = Math.sin(time * floatSpeed + logo.phase) * floatAmp;
                const floatY = Math.cos(time * floatSpeed + logo.phase2) * floatAmp;

                const targetX = logo.originX + floatX;
                const targetY = logo.originY + floatY;

                const dx = targetX - mouse.x;
                const dy = targetY - mouse.y;
                const dist = Math.hypot(dx, dy);

                if (dist < repelRadius && dist > 0) {
                    const force = (1 - dist / repelRadius) * repelStrength;
                    const nx = dx / dist;
                    const ny = dy / dist;
                    logo.vx += nx * force * 30;
                    logo.vy += ny * force * 30;
                }

                logo.vx += (targetX - logo.x) * returnStrength;
                logo.vy += (targetY - logo.y) * returnStrength;
                logo.vx *= friction;
                logo.vy *= friction;

                logo.x += logo.vx;
                logo.y += logo.vy;

                const margin = logoSize / 2 + 10;
                logo.x = Math.max(margin, Math.min(window.innerWidth - margin, logo.x));
                logo.y = Math.max(margin, Math.min(window.innerHeight - margin, logo.y));

                const rotate = logo.angle + Math.sin(time * 0.001 + logo.phase) * 2;
                logo.el.style.transform = `translate(${logo.x}px, ${logo.y}px) translate(-50%, -50%) rotate(${rotate}deg)`;
            });

            requestAnimationFrame(animate);
        }

        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            logos.forEach(logo => {
                logo.originX = Math.max(logoSize, Math.min(w - logoSize, logo.originX));
                logo.originY = Math.max(logoSize, Math.min(h - logoSize, logo.originY));
                logo.x = logo.originX;
                logo.y = logo.originY;
            });
        }

        window.addEventListener('mousemove', updateMouse);
        window.addEventListener('touchmove', e => {
            updateMouse(e.touches[0]);
        }, { passive: true });
        window.addEventListener('resize', handleResize);

        createLogos();
        animate();
    </script>
</body>
</html>
