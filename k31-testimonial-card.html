<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>横版客户证言卡片生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #fafafa;
      --fg: #171717;
      --muted: #737373;
      --border: #e5e5e5;
      --card-gray: #f5f5f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }
    .preview-wrap {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 2 / 1;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      background: #f0f0f0;
    }
    .preview-wrap .card-render {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 540px;
      transform-origin: top left;
    }
    .card-render {
      width: 1080px;
      height: 540px;
      position: relative;
      background: transparent;
    }
    .card-inner {
      position: absolute;
      left: 24px;
      top: 24px;
      width: 1032px;
      height: 492px;
      background: var(--card-gray);
      border-radius: 28px;
      display: flex;
      flex-direction: row;
      padding: 40px;
      gap: 36px;
      overflow: hidden;
    }
    .quote-col {
      flex: 1.7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }
    .info-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      min-width: 0;
      text-align: right;
    }
    .quote-mark {
      font-family: Georgia, serif;
      font-size: 48px;
      line-height: 1;
      opacity: 0.15;
      color: #171717;
      user-select: none;
      margin-right: 10px;
      vertical-align: -4px;
    }
    .testimonial-text {
      font-size: 25px;
      line-height: 1.55;
      font-weight: 600;
      color: #171717;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 6;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta-text {
      font-size: 17px;
      line-height: 1.45;
      color: #737373;
    }
    .name-text {
      font-size: 26px;
      line-height: 1.35;
      font-weight: 600;
      color: #171717;
    }
    .logo-img {
      max-width: 140px;
      max-height: 42px;
      object-fit: contain;
    }
    .divider {
      height: 1px;
      width: 100%;
      background: #d4d4d4;
      margin: 18px 0;
    }
    .capture-stage {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1080px;
      height: 540px;
      z-index: -1;
      pointer-events: none;
      background: transparent;
    }
    input, textarea, button {
      font-family: inherit;
    }
    .upload-box {
      border: 1.5px dashed #d4d4d4;
      border-radius: 10px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: #fff;
    }
    .upload-box:hover { border-color: #171717; background: #fafafa; }
    .field-label {
      font-size: 13px;
      font-weight: 500;
      color: #737373;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .text-input, .text-area {
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      background: #fff;
      color: #171717;
    }
    .text-input:focus, .text-area:focus {
      border-color: #171717;
      box-shadow: 0 0 0 3px rgba(23,23,23,0.06);
    }
    .text-area {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      border: none;
    }
    .btn-primary {
      background: #171717;
      color: #fff;
    }
    .btn-primary:hover { background: #404040; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-[#e5e5e5] bg-white sticky top-0 z-10">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-lg font-semibold tracking-tight">横版客户证言卡片生成器</span>
        <span class="text-xs text-[#737373] bg-[#f0f0f0] px-2 py-1 rounded-full">2:1 · 公众号适配</span>
      </div>
      <div class="text-xs text-[#a3a3a3]">本地 HTML · 无需上传服务器</div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-start">
      <section class="space-y-6">
        <div>
          <div class="field-label">客户 Logo</div>
          <label class="upload-box block" id="logoDrop">
            <input type="file" id="logoInput" accept="image/png,image/jpeg,image/jpg,image/svg+xml" class="hidden">
            <div id="logoPlaceholder">
              <svg class="w-7 h-7 mx-auto text-[#a3a3a3] mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              <div class="text-sm text-[#171717] font-medium">点击上传 Logo</div>
              <div class="text-xs text-[#a3a3a3] mt-1">PNG、JPG、SVG</div>
            </div>
            <div id="logoPreview" class="hidden flex items-center justify-center gap-3">
              <img id="logoThumb" src="" class="max-h-10 object-contain">
              <span class="text-sm text-[#737373]">已上传</span>
              <button type="button" id="removeLogo" class="text-xs text-[#171717] underline">移除</button>
            </div>
          </label>
        </div>

        <div>
          <div class="flex items-center justify-between">
            <div class="field-label">客户证言</div>
            <div class="text-xs text-[#a3a3a3]">卡片中最多显示 6 行文字</div>
          </div>
          <textarea id="quoteInput" class="text-area" placeholder="请输入客户证言内容…">K3.1 支撑团队连续攻关 45 天，在高通量筛选与多轮实验验证中保持了稳定的上下文记忆与推理一致性。它把原本需要数月的分子筛选与验证周期压缩到了几周，并持续跟进实验反馈，让我们的科研管线能够高效运转。</textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <div class="field-label">姓名</div>
            <input type="text" id="nameInput" class="text-input" value="马健" placeholder="姓名">
          </div>
          <div>
            <div class="field-label">职位</div>
            <input type="text" id="titleInput" class="text-input" value="晶泰科技联合创始人兼 CEO" placeholder="职位">
          </div>
        </div>

        <div>
          <div class="field-label">网址 / 公司名</div>
          <input type="text" id="siteInput" class="text-input" value="xtalpi.com" placeholder="例如 example.com">
        </div>

        <div class="pt-2">
          <button id="downloadBtn" class="btn btn-primary w-full sm:w-auto">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            下载 1080px 高清卡片
          </button>
        </div>
      </section>

      <section>
        <div class="flex items-center justify-between mb-4">
          <div class="field-label !mb-0">实时预览</div>
          <div class="text-xs text-[#a3a3a3]">实际导出尺寸 1080 × 540</div>
        </div>
        <div class="preview-wrap" id="previewWrap">
          <div class="card-render" id="previewCard"></div>
        </div>
        <div class="mt-4 text-xs text-[#a3a3a3] leading-relaxed">
          提示：横版卡片更适合微信公众号阅读场景，可减少在手机屏幕上的纵向占用面积。
        </div>
      </section>
    </div>
  </main>

  <div id="captureB" class="capture-stage"></div>

    const state = {
      logo: LOGO_DATA_URI,
      quote: '',
      name: '',
      title: '',
      site: ''
    };

    const els = {
      logoInput: document.getElementById('logoInput'),
      logoDrop: document.getElementById('logoDrop'),
      logoPlaceholder: document.getElementById('logoPlaceholder'),
      logoPreview: document.getElementById('logoPreview'),
      logoThumb: document.getElementById('logoThumb'),
      removeLogo: document.getElementById('removeLogo'),
      quoteInput: document.getElementById('quoteInput'),
      nameInput: document.getElementById('nameInput'),
      titleInput: document.getElementById('titleInput'),
      siteInput: document.getElementById('siteInput'),
      previewWrap: document.getElementById('previewWrap'),
      previewCard: document.getElementById('previewCard'),
      captureB: document.getElementById('captureB'),
      downloadBtn: document.getElementById('downloadBtn')
    };

    function updateState() {
      state.quote = els.quoteInput.value;
      state.name = els.nameInput.value;
      state.title = els.titleInput.value;
      state.site = els.siteInput.value;
      render();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    }

    function getLogoHtml() {
      if (state.logo) {
        return `<img src="${state.logo}" class="logo-img" alt="logo">`;
      }
      return `<div style="padding: 12px 20px; border: 1.5px dashed #d4d4d4; border-radius: 8px; color: #a3a3a3; font-size: 16px;">未上传 Logo</div>`;
    }

    function renderCard(container) {
      container.style.background = 'transparent';
      container.innerHTML = `
        <div class="card-inner">
          <div class="quote-col">
            <div class="testimonial-text">
              <span class="quote-mark">"</span>${escapeHtml(state.quote || '')}
            </div>
          </div>
          <div class="info-col">
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
              <div>${getLogoHtml()}</div>
              <div class="meta-text" style="font-weight: 500; letter-spacing: 0.02em;">${escapeHtml(state.site || '')}</div>
            </div>
            <div style="width: 100%;">
              <div class="divider"></div>
              <div class="name-text">${escapeHtml(state.name || '')}</div>
              <div class="meta-text" style="margin-top: 6px;">${escapeHtml(state.title || '')}</div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderCard(els.previewCard);
      renderCard(els.captureB);
      scalePreview();
    }

    function scalePreview() {
      const wrap = els.previewWrap;
      const card = els.previewCard;
      const scale = wrap.clientWidth / 1080;
      card.style.transform = `scale(${scale})`;
    }

    els.logoInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        state.logo = ev.target.result;
        els.logoThumb.src = state.logo;
        els.logoPlaceholder.classList.add('hidden');
        els.logoPreview.classList.remove('hidden');
        render();
      };
      reader.readAsDataURL(file);
    });

    els.removeLogo.addEventListener('click', e => {
      e.preventDefault();
      state.logo = null;
      els.logoInput.value = '';
      els.logoThumb.src = '';
      els.logoPlaceholder.classList.remove('hidden');
      els.logoPreview.classList.add('hidden');
      render();
    });

    els.logoDrop.addEventListener('dragover', e => { e.preventDefault(); els.logoDrop.style.borderColor = '#171717'; });
    els.logoDrop.addEventListener('dragleave', () => { els.logoDrop.style.borderColor = '#d4d4d4'; });
    els.logoDrop.addEventListener('drop', e => {
      e.preventDefault();
      els.logoDrop.style.borderColor = '#d4d4d4';
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = ev => {
          state.logo = ev.target.result;
          els.logoThumb.src = state.logo;
          els.logoPlaceholder.classList.add('hidden');
          els.logoPreview.classList.remove('hidden');
          render();
        };
        reader.readAsDataURL(file);
      }
    });

    ['quoteInput','nameInput','titleInput','siteInput'].forEach(id => {
      els[id].addEventListener('input', updateState);
    });

    els.downloadBtn.addEventListener('click', async () => {
      els.downloadBtn.disabled = true;
      els.downloadBtn.innerHTML = `<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 生成中…`;
      try {
        const canvas = await html2canvas(els.captureB, {
          width: 1080,
          height: 540,
          scale: 1,
          backgroundColor: null,
          useCORS: true,
          logging: false
        });
        const link = document.createElement('a');
        link.download = `客户证言-横版-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        alert('导出失败：' + err.message);
      } finally {
        els.downloadBtn.disabled = false;
        els.downloadBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> 下载 1080px 高清卡片`;
      }
    });

    window.addEventListener('resize', scalePreview);

    els.logoThumb.src = LOGO_DATA_URI;
    els.logoPlaceholder.classList.add('hidden');
    els.logoPreview.classList.remove('hidden');
    updateState();
    scalePreview();
  </script>
</body>
</html>
